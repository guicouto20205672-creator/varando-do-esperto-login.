<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Varanda do Espeto</title>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#130b08;color:#fff;font:16px Arial,sans-serif;text-align:center">
<p>Abrindo a tela de acesso atualizada da Varanda do Espeto…</p>
<script>
(async()=>{
 try {
  if ('serviceWorker' in navigator) {
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if ('caches' in window) {
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
 } catch(e) {}
 location.replace('./sistema.html?v=34&refresh='+Date.now());
})();
</script>
<p><a style="color:#ff8a45" href="./sistema.html?v=34">Se não abrir, toque aqui para continuar</a></p>
</body>
</html>
