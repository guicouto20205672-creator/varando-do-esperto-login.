*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f5f5}
.stage{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;background:var(--img) center/100% 100% no-repeat}
.card{position:absolute;left:54.82%;top:13.67%;width:41.54%;aspect-ratio:638/748;container-type:inline-size}
.card::before{content:"";position:absolute;inset:-.5%;border-radius:5%;background:#0f0f0f}
.in{position:absolute;inset:0;font-size:calc(100cqw/63.8);border-radius:4.5em;background:linear-gradient(#141414,#0d0d0d);border:1px solid rgba(255,255,255,.1)}
.abs{position:absolute}
.avatar{left:50%;top:5.3em;width:7.8em;height:7.8em;transform:translateX(-50%);border:.3em solid var(--or);border-radius:50%;display:grid;place-items:center}
.avatar svg{width:4em;height:4em}
h2{margin:0;left:0;right:0;top:14em;text-align:center;font-size:3.4em;line-height:4em;font-weight:700}
.sub{left:0;right:0;top:19em;text-align:center;font-size:1.9em;line-height:2.4em;color:#bdbdbd}
.f{left:4.9em;width:54.2em;height:7.1em;background:#171717;border:.1em solid #4a4a4a;border-radius:1.4em}
.f .ic{position:absolute;left:.9em;top:.9em;width:5.2em;height:5.1em;border-radius:1em;background:#222;display:grid;place-items:center}
.f .ic svg{width:2.6em;height:2.6em;stroke:#cfcfcf;fill:none;stroke-width:2}
.f input{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;outline:0;color:#f5f5f5;font:inherit;font-size:2.4em;padding:0 3em 0 3.5em}
.f:focus-within{border-color:var(--or);box-shadow:0 0 0 .3em rgba(242,106,16,.25)}
.eye{position:absolute;right:1.4em;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;padding:0;line-height:0}
.eye svg{width:3em;height:3em;stroke:#cfcfcf;fill:none;stroke-width:2}
.row{left:4.9em;width:54.2em;top:42.2em;height:3.2em;display:flex;justify-content:space-between;align-items:center;font-size:1.9em}
.row label{display:flex;align-items:center;gap:.6em;cursor:pointer;color:#ddd}
.row input{appearance:none;width:1.5em;height:1.5em;border-radius:.3em;background:var(--or);margin:0;position:relative;cursor:pointer}
.row input:not(:checked){background:#222;border:1px solid #666}
.row input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:.85em;color:#fff;font-weight:700}
.row a{color:var(--or);text-decoration:none}
.btn{left:4.9em;width:54.2em;top:48.1em;height:7.2em;border:0;border-radius:1.2em;background:var(--or);color:#fff;font:inherit;font-size:2.4em;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6em}
.btn:hover{background:var(--or2)}
.btn svg{width:1.2em;height:1.2em;stroke:#fff;fill:none;stroke-width:2}
.msg{left:4.9em;width:54.2em;top:56em;text-align:center;font-size:1.5em;color:#ff7d6e;line-height:1.3em}
.msg.ok{color:#7be095}
.mods{left:2.6em;top:60em;width:58.7em;height:12.3em;display:flex;gap:1.2em}
.mods div{flex:1;border-radius:1.4em;background:rgba(255,255,255,.04);text-align:center;font-size:1.4em;color:#e6e6e6;padding-top:1.1em;line-height:1.3}
.mods div:first-child{border:.15em solid #555;background:rgba(255,255,255,.07)}
.mods svg{display:block;width:3.4em;height:3.4em;margin:0 auto .5em;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-aspect-ratio:1/1){
 body{align-items:flex-start;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.2) 35%,rgba(0,0,0,.93) 60%),var(--img) 24% 0/auto 62vh no-repeat,var(--bg)}
 .stage{background:none;aspect-ratio:auto;width:100%;display:flex;justify-content:center;padding:44vh 12px 24px}
 .card{position:relative;left:auto;top:auto;width:min(100%,460px)}
}

.btn:disabled{cursor:wait}
input::placeholder{color:#a9a9a9;opacity:1}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ff9a52;outline-offset:3px}
@media (max-width:520px){
  .stage{padding-top:39vh!important;padding-bottom:28px!important}
  .card{width:min(100%,460px)!important}
  .mods{gap:.55em}
  .mods div{font-size:1.25em}
}
@media (max-height:700px) and (max-aspect-ratio:1/1){
  .stage{padding-top:30vh!important}
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $ = id => document.getElementById(id);
const msg = $('msg');

/*
  CONFIGURAÇÃO NECESSÁRIA:
  1. No Supabase, copie Project URL e anon/public key.
  2. Cole os dois valores abaixo.
  3. Em Authentication > URL Configuration, configure a URL do site.
  Nunca coloque a service_role key neste arquivo.
*/
const SUPABASE_URL = 'COLE_AQUI_A_URL_DO_PROJETO';
const SUPABASE_ANON_KEY = 'COLE_AQUI_A_CHAVE_ANON_PUBLIC';
let supabaseClient = null;

if (window.supabase && SUPABASE_URL.startsWith('https://') &&
    SUPABASE_ANON_KEY !== 'COLE_AQUI_A_CHAVE_ANON_PUBLIC') {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

try {
  const savedEmail = localStorage.getItem('vde_user');
  if (savedEmail) $('user').value = savedEmail;
} catch (_) {}

$('eye').addEventListener('click', () => {
  const showing = $('pass').type === 'text';
  $('pass').type = showing ? 'password' : 'text';
  $('eye').setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
});

function showMessage(text, success = false) {
  msg.className = success ? 'abs msg ok' : 'abs msg';
  msg.textContent = text;
}

async function entrar() {
  const email = $('user').value.trim();
  const password = $('pass').value;
  const button = $('go');

  if (!email || !password) {
    showMessage('Preencha o e-mail e a senha.');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMessage('Digite um endereço de e-mail válido.');
    return;
  }
  if (!supabaseClient) {
    showMessage('Falta configurar a URL e a chave pública do Supabase neste arquivo.');
    return;
  }

  button.disabled = true;
  button.style.opacity = '.7';
  showMessage('Verificando acesso...', true);

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });
    if (error) throw error;

    if ($('rem').checked) {
      try { localStorage.setItem('vde_user', email); } catch (_) {}
    } else {
      try { localStorage.removeItem('vde_user'); } catch (_) {}
    }

    showMessage('Acesso confirmado. Autenticação concluída.', true);
    // Configure aqui o caminho do painel após criar/publicar a página do sistema.
    // Exemplo: window.location.href = './painel.html';
  } catch (error) {
    showMessage(error.message === 'Invalid login credentials'
      ? 'E-mail ou senha incorretos.'
      : 'Não foi possível entrar. Confira a conexão e as configurações do Supabase.');
  } finally {
    button.disabled = false;
    button.style.opacity = '1';
  }
}

$('forgot').addEventListener('click', async event => {
  event.preventDefault();
  const email = $('user').value.trim();
  if (!supabaseClient) {
    showMessage('Configure primeiro a conexão com o Supabase.');
    return;
  }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMessage('Digite seu e-mail no campo acima para receber a recuperação de senha.');
    $('user').focus();
    return;
  }
  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    if (error) throw error;
    showMessage('Se esse e-mail estiver cadastrado, você receberá as instruções de recuperação.', true);
  } catch (_) {
    showMessage('Não foi possível solicitar a recuperação agora. Tente novamente.');
  }
});

$('go').addEventListener('click', entrar);
document.addEventListener('keydown', event => {
  if (event.key === 'Enter') entrar();
});
</script></body></html>
