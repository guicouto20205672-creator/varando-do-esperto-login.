<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Varanda do Espeto | Acesso</title>
<style>html,body{margin:0;min-height:100%;background:#130b08;color:#fff;font:16px Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;text-align:center}a{color:#ff8a45}</style>
</head>
<body>
<main><p>Abrindo a tela de acesso atualizada da Varanda do Espeto…</p><p><a href="./sistema.html?v=33">Se não abrir automaticamente, toque aqui.</a></p></main>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
 }catch(e){}
 location.replace('./sistema.html?v=33&refresh='+Date.now());
})();
</script>
</body>
</html>
